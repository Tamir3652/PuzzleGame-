<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzle Game</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom, #a8e08f, #8fd8c8, #3a82f0);
      }

      .info {
        font-size: 22px;
        color: #12233f;
      }

      /* Оноо, оролдлого, товчийг зэрэгцүүлж, хооронд нь зай гаргана */
      .top {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .main {
        width: 400px;
        height: 400px;
        background-color: rgba(1, 1, 1, 0.5);
        border-radius: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        padding: 30px;
      }

      .card {
        width: 80px;
        height: 80px;
        background-color: rgb(196, 196, 196);
        border: none;
        border-radius: 36px;
        cursor: pointer;
        font-size: 36px;
      }
    </style>
  </head>
  <body>
    <div class="info top">
      <span>Оноо: <span id="score">0</span></span>
      <span>Оролдлого: <span id="tries">0</span></span>
      <button onclick="startGame()">Шинээр эхлэх</button>
    </div>

    <!-- 16 карт. Хаалтан доторх тоо = картын дугаар (values массивын индекс) -->
    <div class="main">
      <button class="card" onclick="openCard(0)">?</button>
      <button class="card" onclick="openCard(1)">?</button>
      <button class="card" onclick="openCard(2)">?</button>
      <button class="card" onclick="openCard(3)">?</button>
      <button class="card" onclick="openCard(4)">?</button>
      <button class="card" onclick="openCard(5)">?</button>
      <button class="card" onclick="openCard(6)">?</button>
      <button class="card" onclick="openCard(7)">?</button>
      <button class="card" onclick="openCard(8)">?</button>
      <button class="card" onclick="openCard(9)">?</button>
      <button class="card" onclick="openCard(10)">?</button>
      <button class="card" onclick="openCard(11)">?</button>
      <button class="card" onclick="openCard(12)">?</button>
      <button class="card" onclick="openCard(13)">?</button>
      <button class="card" onclick="openCard(14)">?</button>
      <button class="card" onclick="openCard(15)">?</button>
    </div>

    <p class="info" id="message"></p>

    <script>
      // ---------- МАССИВУУД ----------

      // 8 царай, тус бүр 2 удаа = 16 карт
      // Хосууд нь зэрэгцэхгүйн тулд гараар холиод бичсэн
      let values = [
        "😀",
        "😎",
        "😡",
        "🤔",
        "😂",
        "😍",
        "😭",
        "😴",
        "😎",
        "😴",
        "😀",
        "😭",
        "😍",
        "😂",
        "🤔",
        "😡",
      ];

      let matched = []; // matched[i] = true бол i-р картын хос олдсон
      let opened = []; // одоо нээлттэй байгаа картуудын дугаар (хамгийн ихдээ 2)

      let score = 0;
      let tries = 0;

      // ---------- СУМТАЙ ФУНКЦУУД ----------

      // Нэг картын бичиг, өнгийг солих.
      // Нэг удаа бичээд, доор олон газраас parameter-ээр өөр утга өгч дуудна.
      //   index -> хэддүгээр карт
      //   text  -> карт дээр юу бичих
      //   color -> ямар өнгөтэй болох
      const paintCard = (index, text, color) => {
        let cards = document.getElementsByClassName("card");
        cards[index].innerText = text;
        cards[index].style.backgroundColor = color;
      };

      // Хос нь олдсон картуудыг тоолоод хариуг return-оор буцаана
      const countMatched = () => {
        let total = 0;
        for (let i = 0; i < matched.length; i++) {
          if (matched[i] === true) {
            total = total + 1;
          }
        }
        return total;
      };

      // Оноо, оролдлогыг дэлгэцэнд шинэчлэх
      const showInfo = () => {
        document.getElementById("score").innerText = score;
        document.getElementById("tries").innerText = tries;
      };

      // Тоглоомыг эхнээс нь эхлүүлэх
      const startGame = () => {
        score = 0;
        tries = 0;
        opened = [];
        matched = [];

        // Бүх картыг хааж, саарал өнгөтэй болгоно
        for (let i = 0; i < values.length; i++) {
          matched[i] = false;
          paintCard(i, "?", "rgb(196, 196, 196)");
        }

        showInfo();
        document.getElementById("message").innerText = "";
      };

      // Нээлттэй картуудыг буцааж "?" болгох
      const closeCards = () => {
        for (let k = 0; k < opened.length; k++) {
          paintCard(opened[k], "?", "rgb(196, 196, 196)");
        }
        opened = [];
      };

      // Нээгдсэн 2 картыг харьцуулах
      const checkPair = () => {
        let a = opened[0];
        let b = opened[1];

        if (values[a] === values[b]) {
          // Ижил -> ногоон болгоно, оноо нэмнэ
          paintCard(a, values[a], "#8fe39a");
          paintCard(b, values[b], "#8fe39a");
          matched[a] = true;
          matched[b] = true;
          opened = [];
          score++;
          showInfo();

          // countMatched()-ийн return хийсэн хариуг шууд ашиглаж байна
          if (countMatched() === values.length) {
            document.getElementById("message").innerText =
              "Баяр хүргэе! " + tries + " оролдлогоор дуусгалаа 🎉";
          }
        } else {
          // Ялгаатай -> 0.8 секундын дараа буцааж хаана
          setTimeout(closeCards, 800);
        }
      };

      // Карт дээр дарахад ажиллана (i = картын дугаар)
      const openCard = (i) => {
        // Аль хэдийн хос нь олдсон бол юу ч хийхгүй
        if (matched[i] === true) {
          return;
        }
        // 2 карт нээлттэй байвал хаагдахыг хүлээнэ
        if (opened.length === 2) {
          return;
        }
        // Нэг картыг 2 удаа дарвал тооцохгүй
        if (opened.length === 1 && opened[0] === i) {
          return;
        }

        paintCard(i, values[i], "white");
        opened.push(i);

        if (opened.length === 2) {
          tries++;
          showInfo();
          checkPair();
        }
      };

      startGame();
    </script>
  </body>
</html>
